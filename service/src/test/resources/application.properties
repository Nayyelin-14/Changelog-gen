# Test configuration - uses H2 in-memory database

quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.migrate-at-start=false

# Disable external service calls in tests
azure.devops.org=test-org
azure.devops.pat=test-pat
github.owner=test-owner
github.token=test-token
ai.api-key=test-key
ai.base-url=https://test.example.com/v1/chat/completions
pipeline.api-keys=test-key
