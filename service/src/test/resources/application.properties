# Test configuration - uses H2 in-memory database

quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.migrate-at-start=false

# Disable external service calls in tests
azure.devops.org=test-org
azure.devops.pat=test-pat
github.owner=test-owner
github.token=test-token
ai.api-key=test-key
ai.base-url=https://test.example.com/v1/chat/completions
pipeline.api-keys=test-key

# GitHub OAuth — enabled with test fixtures so the auth endpoints are testable without a real
# OAuth App. a cookie.secure=false because the test HTTP transport is plaintext.
github.oauth.client-id=test-oauth-client
github.oauth.client-secret=test-oauth-secret
github.oauth.redirect-uri=https://test.example.com/api/auth/github/callback
github.oauth.app-base=https://test.example.com
auth.session-secret=test-session-secret-0123456789abcdef-0123456789abcdef
auth.cookie.secure=false
