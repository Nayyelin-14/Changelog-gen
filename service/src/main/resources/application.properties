quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.ssl-mode=require
quarkus.rest.path=/api
quarkus.log.file.enable=true
quarkus.log.file.path=service.log

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none

# Increase worker thread pool size to prevent exhaustion
quarkus.vertx.worker-pool-size=100
quarkus.vertx.max-worker-execute-time=120s

# GitHub OAuth — lets each user sign in and work against their OWN GitHub account.
# Leave GITHUB_OAUTH_CLIENT_ID/SECRET blank (or unset AUTH_SESSION_SECRET) to keep the
# service account (GITHUB_TOKEN) as the sole identity, as before.
github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID}
github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET}
github.oauth.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI}
github.oauth.app-base=${GITHUB_OAUTH_APP_BASE}
auth.session-secret=${AUTH_SESSION_SECRET}