trigger:
  branches:
    include: [main, dev]
  paths:
    # Azure Pipelines path filters are literal, no wildcards — every .md file in the repo is
    # listed by hand (a new one added elsewhere later needs adding here too, same limitation).
    exclude: [CHANGELOG.md, CHATBOT-PLAN.md, README.md, service/API_ENDPOINTS.md, service/README.md, web-view/README.md]

pr:
  branches:
    include: [dev, main]
  paths:
    exclude: [CHANGELOG.md, CHATBOT-PLAN.md, README.md, service/API_ENDPOINTS.md, service/README.md, web-view/README.md]

variables:
  imageRepository: 'changelog-composer'
  registryHost: 'registry.datasabai.lan'
  changelogServiceUrl: 'https://changelog.datasabai.lan/api/pipeline/generate'

pool:
  name: builder-pool

stages:
  # Runs on every PR and push to dev/main — never touches the registry.
  - stage: CI
    displayName: 'Compile, lint, test'
    jobs:
      - job: FrontendChecks
        displayName: 'Lint and build frontend'
        steps:
          - checkout: self
          - script: bash .azure/scripts/frontend-checks.sh
            displayName: 'npm ci, lint, build (tsc + vite)'

      - job: BackendTests
        displayName: 'Run backend tests'
        steps:
          - checkout: self
          # All external config is stubbed by WireMock/PipelineTestResource/AiProviderProducer.
          # The script spins up its own throwaway Postgres — real credentials never involved.
          - script: bash .azure/scripts/backend-tests.sh
            displayName: './mvnw test'

  # Dogfoods this repo's own /api/pipeline/generate endpoint. Only runs on actual push/merge to
  # dev (never on PR — synthetic merge commits aren't the real tip). Bumps project version
  # (service/pom.xml + web-view/package.json) and optionally prepends a CHANGELOG.md entry.
  # Version bump always succeeds independently — PublishImage always gets a unique Nexus tag
  # even if the changelog API is unreachable.
  - stage: Changelog
    displayName: 'Bump version + generate changelog for this repo'
    dependsOn: CI
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - job: GenerateChangelog
        steps:
          # persistCredentials keeps git fetch working (read). Push uses GIT_PUSH_PAT instead —
          # the Build Service identity lacks "Contribute" on this repo.
          - checkout: self
            fetchDepth: 0
            persistCredentials: true
          # ChangelogApiKey + GitPushPat — set as secret pipeline variables, never committed.
          - script: bash .azure/scripts/generate-own-changelog.sh
            displayName: 'Bump version + generate/commit CHANGELOG.md (changelog part skips if changelogServiceUrl unset)'
            env:
              CHANGELOG_SERVICE_URL: $(changelogServiceUrl)
              CHANGELOG_API_KEY: $(ChangelogApiKey)
              GIT_PUSH_PAT: $(GitPushPat)

  # Fires on merge to dev (where feature work lands). Depends on Changelog to use the bumped
  # version as the tag — if Changelog failed, this skips too, avoiding stale-tag collisions.
  - stage: PublishImage
    displayName: 'Build and push image to Nexus'
    dependsOn: Changelog
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - job: BuildAndPushImage
        steps:
          # persistCredentials for git fetch (read). Tag push uses GIT_PUSH_PAT — same issue as
          # the Changelog stage.
          - checkout: self
            fetchDepth: 0
            persistCredentials: true
          # RegistryUser/RegistryPassword + GitPushPat — set as secret pipeline variables.
          - script: bash .azure/scripts/build-and-push-image.sh
            displayName: 'Build, tag, and push to Nexus (no-ops if nothing image-relevant changed)'
            env:
              IMAGE_REPOSITORY: $(imageRepository)
              REGISTRY_HOST: $(registryHost)
              REGISTRY_USER: $(RegistryUser)
              REGISTRY_PASSWORD: $(RegistryPassword)
              GIT_PUSH_PAT: $(GitPushPat)

  # Promotion step: merge to main = ship what's on dev to the VM. Pulls the exact version tag
  # that PublishImage already pushed to Nexus during the dev build (never :latest, which could
  # be ahead if another dev merge happened before this PR landed). The VM's docker-compose.yml
  # is updated with the pinned tag before restarting, so subsequent manual restarts also use the
  # same version — not whatever :latest happens to point to at that moment.
  #
  # Prerequisites (set up by the senior on the VM):
  #   1. SSH key: the builder-pool agent's public key in the VM's ~/.ssh/authorized_keys
  #   2. docker-compose.yml + .env already exist and work
  #   3. docker login to Nexus is already configured on the VM (e.g. ~/.docker/config.json)
  #
  # Pipeline variables to create (all secret except VmHost/VmUser/VmComposeDir):
  #   VmHost        — IP or hostname of the VM (e.g. "10.0.0.5")
  #   VmUser        — SSH user (e.g. "deploy")
  #   VmComposeDir  — absolute path to the directory with docker-compose.yml (e.g. "/opt/changelog-composer")
  #   SshPrivateKey — the SSH private key that matches ~/.ssh/authorized_keys on the VM
  - stage: DeployToVm
    displayName: 'Deploy to VM'
    dependsOn: CI
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        steps:
          - checkout: self
            fetchDepth: 1
          - script: |
              set -euo pipefail

              VERSION=$(grep -m1 -oP '<version>\K[^<]+' service/pom.xml)
              IMAGE="${REGISTRY_HOST}/${IMAGE_REPOSITORY}:${VERSION}"
              echo "Deploying ${IMAGE} (from pom.xml version ${VERSION})"

              # Write SSH key to a temp file with correct permissions
              SSH_KEY=$(mktemp)
              echo "${SSH_PRIVATE_KEY}" > "$SSH_KEY"
              chmod 600 "$SSH_KEY"
              trap 'rm -f "$SSH_KEY"' EXIT

              ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no \
                "${VM_USER}@${VM_HOST}" \
                "cd ${VM_COMPOSE_DIR} && \
                 echo 'Pinning image to ${IMAGE}' && \
                 sed -i 's|image: .*/changelog-composer:.*|image: ${IMAGE}|' docker-compose.yml && \
                 echo 'Pulling ${IMAGE}' && \
                 docker compose pull && \
                 echo 'Restarting containers' && \
                 docker compose down && \
                 docker compose up -d"
            displayName: 'Pull image and restart on VM'
            env:
              REGISTRY_HOST: $(registryHost)
              IMAGE_REPOSITORY: $(imageRepository)
              VM_HOST: $(VmHost)
              VM_USER: $(VmUser)
              VM_COMPOSE_DIR: $(VmComposeDir)
              SSH_PRIVATE_KEY: $(SshPrivateKey)
