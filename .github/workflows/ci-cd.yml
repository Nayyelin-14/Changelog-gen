name: CI Pipeline (dev)

# dev = integration: tests + self-changelog + Docker image push. Production is NOT here — it's
# the manual `deploy-to-vm` workflow (promote an existing image; nothing is ever rebuilt there).

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'CHATBOT-PLAN.md'
      - 'README.md'
      - 'service/API_ENDPOINTS.md'
      - 'service/README.md'
      - 'web-view/README.md'
  pull_request:
    branches: [dev]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'CHATBOT-PLAN.md'
      - 'README.md'
      - 'service/API_ENDPOINTS.md'
      - 'service/README.md'
      - 'web-view/README.md'

env:
  IMAGE_REPOSITORY: changelog-composer
  REGISTRY_HOST: ghcr.io

jobs:
  # ============================================================
  # CI: Compile, lint, test — runs on every PR and push
  # ============================================================
  frontend-checks:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-view
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-view/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: neondb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d neondb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      # QUARKUS_REST_PATH must be forced here: resources no longer hardcode /api in their own
      # @Path, and quarkus.rest.path=/api in application.properties is not picked up by the
      # Quarkus test augmentation on this runner (same reason .azure/scripts/backend-tests.sh
      # sets it) — without it every "/api/..." test URL 404s.
      - run: ./mvnw test -Dquarkus.datasource.db-kind=postgresql -Dquarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/neondb -Dquarkus.datasource.username=test -Dquarkus.datasource.password=test
        env:
          QUARKUS_PROFILE: test
          QUARKUS_REST_PATH: /api

  # ============================================================
  # CHANGELOG: Append this run's raw dev changelog entry.
  # Only on push to dev (not PR). No version bump — semver changes
  # only on successful production promotion.
  # ============================================================
  generate-changelog:
    name: Append dev changelog entry
    needs: [frontend-checks, backend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for committing CHANGELOG.md
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Append dev changelog entry
        id: changelog
        env:
          CHANGELOG_SERVICE_URL: ${{ secrets.CHANGELOG_SERVICE_URL }}
          CHANGELOG_API_KEY: ${{ secrets.CHANGELOG_API_KEY }}
          GIT_PUSH_PAT: ${{ secrets.GIT_PUSH_PAT }}
        run: |
          bash .github/scripts/generate-own-changelog.sh

  # ============================================================
  # PUBLISH IMAGE: Build and push image to GHCR with an immutable
  # per-run tag `build.{run}-{sha}` (no semver — dev never bumps).
  # Only on push to dev (after changelog).
  # ============================================================
  publish-image:
    name: Build & push image to GHCR
    needs: generate-changelog
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build tag
        id: buildtag
        run: |
          RUN_NUMBER=${{ github.run_number }}
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_TAG="build.${RUN_NUMBER}-${SHORT_SHA}"
          echo "build_tag=$BUILD_TAG" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ lower(github.repository_owner) }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.buildtag.outputs.build_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max