name: Cleanup old GHCR images

on:
  schedule:
    # Weekly on Sundays at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview deletions without actually deleting'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Detect deployed production image
        id: prod
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail

          KEY=$(mktemp)
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"
          trap 'rm -f "$KEY"' EXIT

          IMAGE=$(ssh -i "$KEY" -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes \
            "${VM_USER}@${VM_HOST}" \
            "docker inspect --format '{{.Config.Image}}' changelog-composer-app-1" 2>/dev/null || true)

          if [ -z "$IMAGE" ]; then
            echo "Could not determine the deployed production image; refusing to delete anything." >&2
            exit 1
          fi

          echo "Deployed production image: $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Delete old GHCR image versions
        id: cleanup
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          RETENTION_DAYS: '7'
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          PROD_IMAGE: ${{ steps.prod.outputs.image }}
        run: |
          set -euo pipefail

          OWNER="${{ github.repository_owner }}"
          PKG="changelog-composer"
          RETENTION_SECONDS=$((RETENTION_DAYS * 86400))

          echo "Fetching package versions..."
          VERSIONS=$(curl -sf \
            -H "Authorization: Bearer $GHCR_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${PKG}/versions?per_page=100")

          # The deploy workflow pins production to a digest (ghcr.io/...@sha256:...).
          PROD_TAG=""
          PROD_DIGEST=""
          case "$PROD_IMAGE" in
            *@sha256:*) PROD_DIGEST="${PROD_IMAGE##*@}" ;;
            *:*)        PROD_TAG="${PROD_IMAGE##*:}" ;;
          esac
          if [ -z "$PROD_TAG" ] && [ -z "$PROD_DIGEST" ]; then
            echo "Could not parse deployed image reference: $PROD_IMAGE" >&2
            exit 1
          fi

          # Always keep the newest tagged build (it's either deployed or the latest candidate)
          NEWEST_TAG=$(echo "$VERSIONS" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          tagged = []
          for v in data:
              tags = v.get('metadata',{}).get('container',{}).get('tags',[]) or []
              build_tags = [t for t in tags if t.startswith('build.')]
              if build_tags:
                  tagged.append((v['created_at'], v['id'], build_tags[0]))
          tagged.sort(reverse=True)
          if tagged:
              print(tagged[0][2])
          " 2>/dev/null || echo "")

          echo "Newest build tag: $NEWEST_TAG"
          echo "Deployed image: $PROD_IMAGE (tag=${PROD_TAG:-none}, digest=${PROD_DIGEST:-none})"
          echo ""

          echo "$VERSIONS" | \
            NEWEST_TAG="$NEWEST_TAG" \
            PROD_TAG="$PROD_TAG" \
            PROD_DIGEST="$PROD_DIGEST" \
            RETENTION_SECONDS="$RETENTION_SECONDS" \
            python3 -c "
          import json, os, sys
          from datetime import datetime, timezone

          data = json.load(sys.stdin)
          now = datetime.now(timezone.utc)
          retention = int(os.environ['RETENTION_SECONDS'])
          newest_tag = os.environ['NEWEST_TAG']
          prod_tag = os.environ['PROD_TAG']
          prod_digest = os.environ['PROD_DIGEST']

          for v in data:
              vid = v['id']
              created = v.get('created_at', '')
              tags = v.get('metadata',{}).get('container',{}).get('tags',[]) or []
              build_tags = [t for t in tags if t.startswith('build.')]
              tag_str = ', '.join(tags) if tags else 'untagged'

              # Parse creation time
              try:
                  created_dt = datetime.fromisoformat(created.replace('Z', '+00:00'))
                  age_seconds = (now - created_dt).total_seconds()
              except Exception:
                  age_seconds = 0

              # Always keep the newest tagged build
              if newest_tag and newest_tag in build_tags:
                  print(f'KEEP  | {vid} | {tag_str} | newest build')
                  continue

              # Never delete whatever production is currently running
              if prod_digest and v.get('name') == prod_digest:
                  print(f'KEEP  | {vid} | {tag_str} | deployed production digest')
                  continue
              if prod_tag and prod_tag in build_tags:
                  print(f'KEEP  | {vid} | {tag_str} | deployed production tag')
                  continue

              # Delete ALL untagged images (attestation layers, not runnable)
              if not tags or not build_tags:
                  print(f'DELETE| {vid} | {tag_str} | untagged attestation layer')
                  continue

              # Delete if older than retention period
              if age_seconds > retention:
                  print(f'DELETE| {vid} | {tag_str} | age={int(age_seconds/86400)}d')
              else:
                  print(f'KEEP  | {vid} | {tag_str} | age={int(age_seconds/86400)}d')
          " | tee /tmp/cleanup-plan.txt

          echo ""
          echo "--- Summary ---"
          DELETE_COUNT=$(grep -c '^DELETE' /tmp/cleanup-plan.txt || true)
          KEEP_COUNT=$(grep -c '^KEEP' /tmp/cleanup-plan.txt || true)
          echo "To delete: $DELETE_COUNT | To keep: $KEEP_COUNT"

          if [ "$DRY_RUN" = "true" ]; then
            echo ""
            echo "DRY RUN — no deletions performed."
            exit 0
          fi

          if [ "$DELETE_COUNT" -eq 0 ]; then
            echo "Nothing to delete."
            exit 0
          fi

          echo ""
          echo "Deleting..."
          FAILED_COUNT=0
          while IFS='|' read -r _action vid _rest; do
            vid=$(echo "$vid" | tr -d ' ')
            # Extract tag name from the rest
            tag=$(echo "$_rest" | cut -d'|' -f1 | tr -d ' ')
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -X DELETE \
              -H "Authorization: Bearer $GHCR_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/${PKG}/versions/$vid")
            if [ "$status" = "204" ] || [ "$status" = "200" ]; then
              echo "  Deleted $vid ($tag): HTTP $status"
            else
              echo "  FAILED  $vid ($tag): HTTP $status" >&2
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
          done < <(grep '^DELETE' /tmp/cleanup-plan.txt || true)

          echo "Done."

          # Write outputs for the notification step
          echo "delete_count=$DELETE_COUNT" >> "$GITHUB_OUTPUT"
          echo "keep_count=$KEEP_COUNT" >> "$GITHUB_OUTPUT"
          echo "failed_count=$FAILED_COUNT" >> "$GITHUB_OUTPUT"

          # Build the deleted list as a multi-line output
          {
            echo "deleted_list<<EOF"
            grep '^DELETE' /tmp/cleanup-plan.txt | sed 's/^DELETE|/  -/' || echo "  (none)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # Write the summary for the job summary
          {
            echo "## GHCR Cleanup Report"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Deleted | $DELETE_COUNT |"
            echo "| Failed | $FAILED_COUNT |"
            echo "| Kept | $KEEP_COUNT |"
            echo ""
            if [ "$DELETE_COUNT" -gt 0 ]; then
              echo "### Deleted versions"
              echo '```'
              grep '^DELETE' /tmp/cleanup-plan.txt || true
              echo '```'
            else
              echo "_No images exceeded the ${RETENTION_DAYS}-day retention period._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "::error::$FAILED_COUNT deletion(s) failed"
            exit 1
          fi

      - name: Create issue if images were deleted
        if: steps.cleanup.outputs.delete_count != '0' && inputs.dry_run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const deleteCount = '${{ steps.cleanup.outputs.delete_count }}';
            const keepCount = '${{ steps.cleanup.outputs.keep_count }}';
            const deletedList = `${{ steps.cleanup.outputs.deleted_list }}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `GHCR Cleanup: ${deleteCount} old images deleted`,
              body: [
                `## GHCR Image Cleanup Report`,
                ``,
                `| Metric | Count |`,
                `|--------|-------|`,
                `| Deleted | ${deleteCount} |`,
                `| Kept | ${keepCount} |`,
                ``,
                `### Deleted versions`,
                '```',
                deletedList.trim(),
                '```',
                ``,
                `Production image is always preserved automatically.`,
                ``,
                `[View workflow run](${runUrl})`,
              ].join('\n'),
              labels: ['maintenance'],
            });
